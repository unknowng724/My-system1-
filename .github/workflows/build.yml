name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean Remnants & Prepare App
        run: |
          # مسح أي بقايا ملفات قديمة معطوبة من المحاولات السابقة
          rm -rf android capacitor.config.* package*.json node_modules www

          # إنشاء مجلد الويب ونقل كافة ملفات الموقع إليه أوتوماتيكياً
          mkdir -p www
          shopt -s dotglob
          for item in *; do
            if [ "$item" != "www" ] && [ "$item" != ".git" ] && [ "$item" != ".github" ]; then
              cp -r "$item" www/ 2>/dev/null || true
            fi
          done

          # تهيئة التطبيق وبناء منصة الأندرويد من الصفر
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MyApp" "com.mycompany.myapp" --web-dir "www"
          npx cap add android
          npx cap sync

      - name: Build APK File
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
