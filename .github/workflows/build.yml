name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean & Prepare App
        run: |
          rm -rf android capacitor.config.* package*.json node_modules www
          mkdir -p www
          shopt -s dotglob
          for item in *; do
            if [ "$item" != "www" ] && [ "$item" != ".git" ] && [ "$item" != ".github" ]; then
              cp -r "$item" www/ 2>/dev/null || true
            fi
          done
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MyApp" "com.mycompany.myapp" --web-dir "www"
          npx cap add android
          npx cap sync

      - name: Fix Kotlin Duplicate Classes Conflict
        run: |
          echo 'configurations.all { resolutionStrategy { exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"; exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8" } }' >> android/app/build.gradle

      - name: Build APK File
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
