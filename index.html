<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج طلبات الطباعة السريع</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; padding: 10px; }
        .form-container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 20px 25px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="file"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .loading { display: none; color: #ff9800; font-weight: bold; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>طلب طباعة جديد</h2>
    <!-- تم إضافة enctype لدعم رفع الملفات بشكل صحيح -->
    <form id="printForm" enctype="multipart/form-data">
        
        <div class="form-group">
            <label for="clientName">اسم العميل:</label>
            <input type="text" id="clientName" required placeholder="اكتب الاسم الكامل">
        </div>

        <div class="form-group">
            <label for="phoneNumber">رقم الهاتف:</label>
            <input type="text" id="phoneNumber" required placeholder="05xxxxxxxx">
        </div>

        <div class="form-group">
            <label for="docFile">رفع المستند العام (PDF / Word):</label>
            <input type="file" id="docFile" accept=".pdf,.doc,.docx">
        </div>
        <div class="form-group">
            <label for="photoFile">رفع الصور العامة:</label>
            <input type="file" id="photoFile" accept="image/*">
        </div>

        <div class="form-group">
            <label for="tshirtFile">تصميم التيشرت / الكوب:</label>
            <input type="file" id="tshirtFile" accept="image/*">
        </div>

        <button type="submit" id="submitBtn">إرسال الطلب فوراً</button>
        <div id="loadingText" class="loading">جاري رفع الملفات وإرسال الطلب بسرعة فائقة... الرجاء الانتظار...</div>
    </form>
</div>

<!-- هنا كود الـ JavaScript الجديد والمطور لـ Airtable بدلاً من غوغل سكربت -->
<script>
const AIRTABLE_TOKEN = "patRAeLv5uCORr38T.1fbdac69026d3512d8a7dcd75a07c45073de41bac13b8af2740c808b2a31ba88";
const AIRTABLE_BASE_ID = "appdzr6ifxsKDNzLJ"; 
const AIRTABLE_TABLE_NAME = "Sheet1"; // تأكد أن اسم الجدول في Airtable هو Sheet1 تماماً

// دالة مساعدة لقراءة الملف وتحويله لرفعه سريعاً
function getFileData(fileInputId) {
    const fileField = document.getElementById(fileInputId).files[0];
    if (!fileField) return null;
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = function() {
            const base64Data = reader.result.split(',')[1];
            resolve({
                data: base64Data,
                fileName: fileField.name,
                mimeType: fileField.type
            });
        };
        reader.readAsDataURL(fileField);
    });
}

// دالة الرفع السحابي السريع للحصول على رابط مباشر تقبله Airtable
async function uploadToTemporaryStorage(fileData) {
    if (!fileData) return null;
    try {
        const res = await fetch(`data:${fileData.mimeType};base64,${fileData.data}`);
        const blob = await res.blob();
        
        const formData = new FormData();
        formData.append('file', blob, fileData.fileName);

        const uploadResponse = await fetch('https://file.io', {
            method: 'POST',
            body: formData
        });
        const uploadResult = await uploadResponse.json();
        return uploadResult.link; 
    } catch (error) {
        console.error("خطأ في رفع الملف:", error);
        return null;
    }
}

// تشغيل الحدث عند الضغط على زر الإرسال
document.getElementById('printForm').addEventListener('submit', async function(event) {
    event.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const loadingText = document.getElementById('loadingText');
    
    submitBtn.disabled = true;
    loadingText.style.display = 'block';

    try {
        // قراءة الملفات من المدخلات
        const docData = await getFileData('docFile');
        const photoData = await getFileData('photoFile');
        const tshirtData = await getFileData('tshirtFile');

        // رفع الملفات بالتوازي بسرعة
        const docUrl = await uploadToTemporaryStorage(docData);
        const photoUrl = await uploadToTemporaryStorage(photoData);
        const tshirtUrl = await uploadToTemporaryStorage(tshirtData);

        // تجهيز الأعمدة والبيانات لتطابق حساب Airtable الخاص بك
        const fields = {
            "اسم العميل": document.getElementById('clientName').value,
            "رقم الهاتف": document.getElementById('phoneNumber').value,
            "التاريخ والوقت": new Date().toLocaleString("ar-EG")
        };

        // إدراج المرفقات كـ Attachment داخل جداول Airtable
        if (docUrl) fields["رابط المستند"] = [{ "url": docUrl }];
        if (photoUrl) fields["رابط الصورة المرفوعة"] = [{ "url": photoUrl }];
        if (tshirtUrl) fields["رابط تصميم التيشرت/الكوب"] = [{ "url": tshirtUrl }];

        // إرسال الطلب لـ Airtable
        const response = await fetch(`https://airtable.com{AIRTABLE_BASE_ID}/${AIRTABLE_TABLE_NAME}`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${AIRTABLE_TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ records: [{ fields: fields }] })
        });

        if (response.ok) {
            alert("شكراً لتعاونكم! تم استلام طلبكم وحفظه في Airtable بنجاح وبسرعة فائقة.");
            document.getElementById('printForm').reset();
        } else {
            const errResult = await response.json();
            alert("حدث خطأ أثناء الحفظ في Airtable: " + errResult.error.message);
        }
    } catch (error) {
        alert("فشل الاتصال بالسيرفر: " + error.toString());
    } finally {
        submitBtn.disabled = false;
        loadingText.style.display = 'none';
    }
});
</script>
</body>
</html>
