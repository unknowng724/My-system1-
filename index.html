<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تطبيق مكتبتي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Font (Cairo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        background-color: #f8fafc;
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-3 sm:p-6">

    <div class="w-full max-w-lg bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
      
      <!-- Header Header Section -->
      <div class="bg-slate-900 text-white p-6 text-center relative overflow-hidden">
        <div class="absolute -right-10 -top-10 w-32 h-32 bg-amber-500/20 rounded-full blur-2xl"></div>
        <div class="absolute -left-10 -bottom-10 w-32 h-32 bg-blue-500/20 rounded-full blur-2xl"></div>
        <h1 class="text-2xl font-bold tracking-wide flex items-center justify-center gap-2">
          <i class="fa-solid font-bold fa-print text-amber-400"></i>
          مكتبتي - نموذج الطلبات
        </h1>
        <p class="text-xs text-slate-400 mt-1">أرسل طلبك بسهولة وسنقوم بالطباعة فوراً</p>
      </div>

      <!-- Service Selector Tabs -->
      <div class="p-4 bg-slate-50 border-b border-slate-100">
        <label class="block text-xs font-bold text-slate-600 mb-2">اختر نوع الخدمة:</label>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" onclick="switchTab('print')" id="tab-print" class="tab-btn py-2.5 px-2 rounded-xl text-xs font-bold transition flex flex-col items-center gap-1 bg-amber-500 text-white shadow-sm">
            <i class="fa-solid fa-file-pdf text-base"></i>
            <span>طباعة ملفات</span>
          </button>
          <button type="button" onclick="switchTab('books')" id="tab-books" class="tab-btn py-2.5 px-2 rounded-xl text-xs font-bold transition flex flex-col items-center gap-1 bg-white text-slate-600 border border-slate-200 hover:bg-slate-100">
            <i class="fa-solid fa-book text-base"></i>
            <span>كتب مدرسية</span>
          </button>
          <button type="button" onclick="switchTab('tshirt')" id="tab-tshirt" class="tab-btn py-2.5 px-2 rounded-xl text-xs font-bold transition flex flex-col items-center gap-1 bg-white text-slate-600 border border-slate-200 hover:bg-slate-100">
            <i class="fa-solid fa-shirt text-base"></i>
            <span>تيشرت / كوب</span>
          </button>
        </div>
      </div>

      <!-- Main Interactive Form -->
      <form id="orderForm" onsubmit="handleFormSubmit(event)" class="p-5 sm:p-7 space-y-4">
        
        <!-- Field: Full Arabic Name with Real-Time Filter -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">الاسم الثلاثي (بالعربية فقط) <span class="text-red-500">*</span></label>
          <div class="relative">
            <input 
              type="text" 
              id="fullName" 
              required 
              oninput="validateNameInput(this)"
              placeholder="مثال: محمد أحمد علي" 
              class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 pr-10 text-sm focus:outline-none focus:border-amber-500 transition" 
            />
            <i class="fa-solid fa-user absolute right-3.5 top-3 text-slate-400 text-sm"></i>
          </div>
          <p id="nameError" class="hidden text-[11px] text-red-500 mt-1 font-semibold">يرجى كتابة الاسم بالحروف العربية فقط وبدون أرقام.</p>
        </div>

        <!-- Dynamic Section 1: File Printing -->
        <div id="section-print" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">عدد النسخ <span class="text-red-500">*</span></label>
            <div class="relative">
              <input type="number" id="copies" min="1" value="1" required class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 pr-10 text-sm focus:outline-none focus:border-amber-500 transition" />
              <i class="fa-solid fa-copy absolute right-3.5 top-3 text-slate-400 text-sm"></i>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">رفع مستند (PDF / Word) <span class="text-red-500">*</span></label>
            <div class="border-2 border-dashed border-amber-300 bg-amber-50/40 rounded-xl p-4 text-center hover:bg-amber-50 transition cursor-pointer relative">
              <input type="file" id="documentFile" accept=".pdf,.doc,.docx,.ppt,.pptx" required onchange="updateFileName('documentFile', 'docFileName')" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
              <i class="fa-solid fa-cloud-arrow-up text-2xl text-amber-500 mb-1"></i>
              <p id="docFileName" class="text-xs text-slate-600 font-semibold">اختر مستنداً لرفعه...</p>
              <p class="text-[10px] text-slate-400 mt-0.5">يقبل ملفات PDF و Word</p>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">رفع صورة إضافية (اختياري)</label>
            <div class="border-2 border-dashed border-slate-200 bg-slate-50/50 rounded-xl p-3 text-center hover:bg-slate-100 transition cursor-pointer relative">
              <input type="file" id="photoFile" accept="image/*" onchange="updateFileName('photoFile', 'photoFileName')" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
              <i class="fa-solid fa-image text-xl text-slate-400 mb-1"></i>
              <p id="photoFileName" class="text-xs text-slate-500">اختر صورة (اختياري)</p>
            </div>
          </div>
        </div>

        <!-- Dynamic Section 2: School Books -->
        <div id="section-books" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">اسم الكتاب والصف الدراسي <span class="text-red-500">*</span></label>
            <input type="text" id="bookDetails" placeholder="مثال: الرياضيات - الصف التاسع" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm focus:outline-none focus:border-amber-500 transition" />
          </div>
        </div>

        <!-- Dynamic Section 3: Tshirt / Cup Design -->
        <div id="section-tshirt" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">وصف التصميم أو اسم الصورة <span class="text-red-500">*</span></label>
            <input type="text" id="tshirtDesign" placeholder="مثال: طباعة صورة شخصية على كوب أبيض" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm focus:outline-none focus:border-amber-500 transition" />
          </div>
        </div>

        <!-- Field: Notes with Strict 10-Word Counter -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-bold text-slate-700">إضافة ملاحظات (اختياري)</label>
            <span id="wordCounter" class="text-[10px] text-slate-400 font-bold">0 / 10 كلمة</span>
          </div>
          <textarea 
            id="notes" 
            rows="2" 
            oninput="updateWordCount(this)" 
            placeholder="اكتب ملاحظاتك بالعربية (بحد أقصى 10 كلمات)..." 
            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 transition resize-none"
          ></textarea>
        </div>

        <!-- Dynamic Notification Alert Box -->
        <div id="alertBox" class="hidden p-3 rounded-xl text-xs font-bold text-center"></div>

        <!-- Action Submit Buttons -->
        <div class="pt-2 flex gap-2">
          <button type="submit" id="submitBtn" class="flex-1 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-amber-500/20 transition flex items-center justify-center gap-2 text-sm">
            <span>إرسال البيانات</span>
            <i class="fa-solid fa-paper-plane"></i>
          </button>
          <button type="reset" onclick="resetFormState()" class="px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-xs transition">
            إلغاء
          </button>
        </div>

      </form>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
      // Airtable API Credentials
      const AIRTABLE_API_KEY = "patJvhfD0N0eY5vV9.c228ed834cd4150aa89c6292374edb17dd41ffae9e2dc1ef0b4fb8135be3620e";
      const AIRTABLE_BASE_ID = "appvf5K46bOeaHCSi";
      const AIRTABLE_TABLE_NAME = "طلبات الطباعة";

      let activeTab = 'print';

      // Switch Tab Function
      function switchTab(tab) {
        activeTab = tab;
        const tabs = ['print', 'books', 'tshirt'];
        
        tabs.forEach(t => {
          const btn = document.getElementById(`tab-${t}`);
          const sec = document.getElementById(`section-${t}`);
          if (t === tab) {
            btn.className = "tab-btn py-2.5 px-2 rounded-xl text-xs font-bold transition flex flex-col items-center gap-1 bg-amber-500 text-white shadow-sm";
            sec.classList.remove('hidden');
          } else {
            btn.className = "tab-btn py-2.5 px-2 rounded-xl text-xs font-bold transition flex flex-col items-center gap-1 bg-white text-slate-600 border border-slate-200 hover:bg-slate-100";
            sec.classList.add('hidden');
          }
        });

        const docInput = document.getElementById('documentFile');
        if (tab === 'print') {
          docInput.setAttribute('required', 'required');
        } else {
          docInput.removeAttribute('required');
        }
      }

      // Name Input Validation: Strip numbers and non-Arabic characters in real-time
      function validateNameInput(input) {
        const nameError = document.getElementById('nameError');
        const hasInvalidChar = /[0-9a-zA-Z]/.test(input.value);
        
        if (hasInvalidChar) {
          input.value = input.value.replace(/[0-9a-zA-Z]/g, '');
          nameError.classList.remove('hidden');
        } else {
          nameError.classList.add('hidden');
        }
      }

      // Strict Word Counter (Max 10 Words)
      function updateWordCount(textarea) {
        const counter = document.getElementById('wordCounter');
        const text = textarea.value.trim();
        const words = text ? text.split(/\s+/) : [];

        if (words.length > 10) {
          textarea.value = words.slice(0, 10).join(' ');
          counter.innerText = '10 / 10 كلمة (الحد الأقصى)';
          counter.className = 'text-[10px] text-red-500 font-bold';
        } else {
          counter.innerText = `${words.length} / 10 كلمة`;
          counter.className = 'text-[10px] text-slate-400 font-bold';
        }
      }

      // Dynamic File Label Updater
      function updateFileName(inputId, targetId) {
        const input = document.getElementById(inputId);
        const target = document.getElementById(targetId);
        if (input.files && input.files[0]) {
          target.innerText = "تم اختيار: " + input.files[0].name;
          target.classList.add('text-amber-600');
        } else {
          target.innerText = "اختر مستنداً لرفعه...";
          target.classList.remove('text-amber-600');
        }
      }

      // Reset Form State
      function resetFormState() {
        document.getElementById('docFileName').innerText = "اختر مستنداً لرفعه...";
        document.getElementById('photoFileName').innerText = "اختر صورة (اختياري)";
        document.getElementById('alertBox').className = "hidden p-3 rounded-xl text-xs font-bold text-center";
        document.getElementById('nameError').classList.add('hidden');
        document.getElementById('wordCounter').innerText = "0 / 10 كلمة";
      }

      // Automatic Direct Upload to Cloud Storage
      async function uploadFileDirect(file) {
        // Option 1: Pixeldrain API
        try {
          const formData = new FormData();
          formData.append('file', file);
          const res = await fetch('https://pixeldrain.com/api/file', {
            method: 'POST',
            body: formData
          });
          if (res.ok) {
            const data = await res.json();
            if (data.id) {
              return `https://pixeldrain.com/api/file/${data.id}`;
            }
          }
        } catch (e) {
          console.warn('Pixeldrain upload failed, switching to backup...', e);
        }

        // Option 2: Catbox API Fallback
        try {
          const formData = new FormData();
          formData.append('reqtype', 'fileupload');
          formData.append('fileToUpload', file);
          const res = await fetch('https://catbox.moe/user/api.php', {
            method: 'POST',
            body: formData
          });
          if (res.ok) {
            const fileUrl = await res.text();
            if (fileUrl && fileUrl.startsWith('http')) {
              return fileUrl.trim();
            }
          }
        } catch (e) {
          console.warn('Catbox upload failed', e);
        }

        throw new Error('فشل رفع الملف، يرجى إعادة المحاولة.');
      }

      // Handle Submit Event
      async function handleFormSubmit(event) {
        event.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        
        const nameInput = document.getElementById('fullName');
        const name = nameInput.value.trim();

        // Validate Arabic Name Strict
        const arabicRegex = /^[\u0600-\u06FF\s]+$/;
        if (!name || !arabicRegex.test(name)) {
          alertBox.className = "p-3 rounded-xl text-xs font-bold text-center bg-red-50 text-red-600 border border-red-200 block";
          alertBox.innerText = "يرجى كتابة الاسم الثلاثي باللغة العربية فقط وبدون أرقام.";
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>جاري رفع الملفات والحفظ...</span>`;
        alertBox.className = "hidden";

        try {
          const copies = document.getElementById('copies').value || "1";
          const notes = document.getElementById('notes').value.trim();

          const docFileInput = document.getElementById('documentFile');
          const photoFileInput = document.getElementById('photoFile');

          let docUrl = "";
          let photoUrl = "";

          // Upload Document if selected
          if (activeTab === 'print' && docFileInput.files && docFileInput.files[0]) {
            docUrl = await uploadFileDirect(docFileInput.files[0]);
          }

          // Upload Optional Photo if selected
          if (photoFileInput.files && photoFileInput.files[0]) {
            photoUrl = await uploadFileDirect(photoFileInput.files[0]);
          }

          // Service Title Mapping
          const serviceNames = {
            'print': 'طباعة ملفات',
            'books': 'كتب مدرسية',
            'tshirt': 'تيشرت / كوب'
          };

          // Build Airtable Payload
          const fieldsData = {
            "الخدمة": serviceNames[activeTab] || 'طباعة ملفات',
            "الاسم الثلاثي": String(name),
            "عدد النسخ": String(copies),
            "الملاحظات": String(notes || "-"),
            "اسم المستند": String(docUrl || "-"),
            "اسم الصورة": String(photoUrl || "-"),
            "طباعة كتب": String(document.getElementById('bookDetails')?.value || "-"),
            "اسم تصميم التيشرت": String(document.getElementById('tshirtDesign')?.value || "-")
          };

          // Send to Airtable API
          const response = await fetch(`https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${encodeURIComponent(AIRTABLE_TABLE_NAME)}`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${AIRTABLE_API_KEY}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              typecast: true,
              records: [{ fields: fieldsData }]
            })
          });

          const result = await response.json();

          if (response.ok) {
            alertBox.className = "p-3 rounded-xl text-xs font-bold text-center bg-emerald-50 text-emerald-700 border border-emerald-200 block";
            alertBox.innerText = "✅ تم إرسال الطلب ورفع الملف بنجاح!";
            document.getElementById('orderForm').reset();
            resetFormState();
          } else {
            const errField = result.error?.message || JSON.stringify(result.error);
            throw new Error(errField);
          }

        } catch (error) {
          alertBox.className = "p-3 rounded-xl text-xs font-bold text-center bg-red-50 text-red-600 border border-red-200 block";
          alertBox.innerText = "حدث خطأ أثناء الإرسال: " + error.message;
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>إرسال البيانات</span> <i class="fa-solid fa-paper-plane"></i>`;
        }
      }
    </script>
  </body>
</html>
